name: Update airspace outlines

# The SHV/FSVL outlines change about once a year: once a day is plenty, early in the
# morning (UTC), before pilots look at the day's DABS. The hourly DABS job reads the
# copy this keeps (scripts/shv_airspaces.py).
on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the airspaces the DABS activates
        run: python3 scripts/shv_airspaces.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/shv/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update airspace outlines"
            # The hourly DABS job may have pushed in the meantime.
            git pull --rebase
            git push
          fi
