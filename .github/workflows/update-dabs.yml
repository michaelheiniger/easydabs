name: Update DABS data

on:
  schedule:
    - cron: "18 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y poppler-utils

      - name: Fetch and parse DABS PDFs
        run: python3 scripts/fetch_dabs.py

      - name: Commit and push if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update DABS data"
            git push
            # Pushes made with GITHUB_TOKEN don't trigger other workflows' `push`
            # events, so deploy-pages must be dispatched explicitly.
            gh workflow run deploy-pages.yml --ref "${GITHUB_REF_NAME}"
          fi
