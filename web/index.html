<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyDABS — Swiss Airspace Briefing</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header id="app-header">
  <h1>EasyDABS</h1>
  <span id="dabs-meta" class="meta"></span>
  <div id="date-tabs" class="date-tabs"></div>
  <div id="lang-switch" class="lang-switch"></div>
</header>

<details id="disclaimer">
  <summary id="disclaimer-label">Disclaimer:</summary>
  <div class="disclaimer-body">
    <span id="disclaimer-text"></span>
    <a id="official-link" href="https://www.skybriefing.com/o/dabs?today" target="_blank" rel="noopener"></a>.
    <span id="disclaimer-tz-prefix"></span> <strong id="disclaimer-tz-bold"></strong><span id="disclaimer-tz-suffix"></span>
  </div>
</details>

<div id="main-content">
  <details id="area-list-panel">
    <summary class="area-list-header">
      <h2 id="area-list-title"></h2>
      <div class="area-list-hint" id="area-list-hint"></div>
    </summary>
    <ul id="area-list"></ul>
  </details>

  <div id="map">
    <div id="status" class="status hidden"></div>

    <details id="legend" class="legend">
      <summary id="legend-title"></summary>
      <div class="legend-row"><span class="swatch chart"></span><span id="legend-on-chart"></span></div>
      <div class="legend-row"><span class="swatch not-chart"></span><span id="legend-not-on-chart"></span></div>
      <div class="legend-row"><span class="swatch poly"></span><span id="legend-polygon"></span></div>
      <div class="legend-row"><span class="swatch circ"></span><span id="legend-circle"></span></div>
    </details>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
