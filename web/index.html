<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EasyDABS — Swiss Airspace Briefing</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
<header id="app-header">
  <h1>EasyDABS</h1>
  <span id="dabs-meta" class="meta"></span>
  <div id="date-tabs" class="date-tabs"><a id="pdf-today" class="pdf-link" href="https://www.skybriefing.com/o/dabs?today" target="_blank" rel="noopener"><img src="skybriefing_logo.png" alt="Skybriefing" class="pdf-logo"><span class="pdf-label"></span></a><a id="pdf-tomorrow" class="pdf-link" href="https://www.skybriefing.com/o/dabs?tomorrow" target="_blank" rel="noopener"><img src="skybriefing_logo.png" alt="Skybriefing" class="pdf-logo"><span class="pdf-label"></span></a></div>
  <div id="lang-switch" class="lang-switch"></div>
  <button id="feedback-open" class="feedback-btn" type="button"></button>
  <select id="lang-select" class="lang-select" aria-label="Language"></select>
</header>

<details id="disclaimer">
  <summary id="disclaimer-label">Disclaimer:</summary>
  <div class="disclaimer-body">
    <span id="disclaimer-text"></span>
    <a id="official-link" href="https://www.skybriefing.com/o/dabs?today" target="_blank" rel="noopener"></a>.
    <span id="disclaimer-tz-prefix"></span> <strong id="disclaimer-tz-bold"></strong><span id="disclaimer-tz-suffix"></span>
  </div>
</details>

<div id="main-content">
  <div id="area-list-panel">
    <div class="area-list-header" id="area-list-toggle" role="button" tabindex="0" aria-expanded="false">
      <span class="area-list-arrow" aria-hidden="true"></span>
      <h2 id="area-list-title"></h2>
      <div class="area-list-hint" id="area-list-hint"></div>
    </div>
    <ul id="area-list"></ul>
  </div>

  <div id="map">
    <div id="status" class="status hidden"></div>

    <details id="legend" class="legend">
      <summary id="legend-title"></summary>
      <div class="legend-row"><span class="swatch poly"></span><span id="legend-polygon"></span></div>
      <div class="legend-row"><span class="swatch circ"></span><span id="legend-circle"></span></div>
    </details>
  </div>
</div>

<dialog id="feedback-dialog" class="feedback-dialog" aria-labelledby="feedback-title">
  <form id="feedback-form">
    <h2 id="feedback-title"></h2>
    <p id="feedback-intro" class="feedback-intro"></p>
    <label for="feedback-category" id="feedback-category-label"></label>
    <select id="feedback-category" name="category">
      <option value="area"></option>
      <option value="time"></option>
      <option value="bug"></option>
      <option value="other"></option>
    </select>
    <label for="feedback-message" id="feedback-message-label"></label>
    <textarea id="feedback-message" name="message" rows="6" maxlength="5000" required></textarea>
    <label for="feedback-email" id="feedback-email-label"></label>
    <input id="feedback-email" name="email" type="email" autocomplete="email">
    <!-- Honeypot: hidden from people, ticked by naive bots; Web3Forms drops any submission where it's set. -->
    <input type="checkbox" name="botcheck" class="feedback-botcheck" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p id="feedback-context-note" class="feedback-note"></p>
    <p id="feedback-status" class="feedback-status" role="status"></p>
    <div class="feedback-actions">
      <button id="feedback-cancel" type="button"></button>
      <button id="feedback-submit" type="submit" class="primary"></button>
    </div>
  </form>
</dialog>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
